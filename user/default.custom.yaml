# Rime default custom settings
# UTF-8
patch:
  schema_list:
    - schema: niumawb
    - schema: terra_pinyin
#    - schema: nmzg

  switcher/hotkeys: 
    - Control+grave

  key_binder:
    bindings: 
      - { when: has_menu, accept: semicolon, send: 2 }
      - { when: has_menu, accept: apostrophe, send: 3 }
      - { when: has_menu, accept: Tab, send: 4 } 

  menu:
    page_size: 5
    alternative_select_labels: [" ", "❷", "❸", "❹", "❺", "❻", "❼", "❽", "❾"]
